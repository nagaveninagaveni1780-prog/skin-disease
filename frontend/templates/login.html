{% extends "base.html" %}
{% block title %}Login — SkinSense{% endblock %}
{% block content %}

<section class="page-header">
    <h1>Welcome Back</h1>
    <p class="page-subtitle">Log in to view your saved assessment history.</p>
</section>

<div class="auth-card">
    <form method="POST" action="/login">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-full">Log In</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="/signup">Sign up</a></p>
</div>

{% endblock %}
